[project]
name = "pivot-backend-api"
version = "0.1.0"
description = "FastAPI service for pivot table operations using DuckDB"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "duckdb>=0.9.2",
    "pandas>=2.0.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6",
    "openpyxl>=3.1.2",
    "jinja2>=3.1.2",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.2.1",
    "httpx>=0.25.2",
]

[tool.uv]
dev-dependencies = []

[tool.uv.sources]

